      user-select: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

      font-family: 'Fredoka', 'Inter', sans-serif;
    }

    .banner-callout-text {
      font-family: 'Fredoka', sans-serif;
      font-weight: 700;
      letter-spacing: 0.01em;
      paint-order: stroke fill;
      -webkit-text-stroke: 5px #ffffff;
      text-shadow: 0 4px 12px rgba(20, 60, 50, 0.16);
    }

    /* Mini floating "Eagle Eye!" callout */
    .eagle-callout-text {
      font-family: 'Fredoka', sans-serif;
      font-weight: 700;
      color: #1698b5;
      paint-order: stroke fill;
      -webkit-text-stroke: 4px #ffffff;
      text-shadow: 0 3px 8px rgba(15, 50, 45, 0.18);
    }

    @keyframes topBannerPop {
      0% {
        opacity: 0;
        transform: translate(-50%, 10px) scale(0.55);
      }
      18% {
        opacity: 1;
        transform: translate(-50%, -2px) scale(1.12);
      }
      32% {
        transform: translate(-50%, 0px) scale(0.98);
      }
      80% {
        opacity: 1;
        transform: translate(-50%, -4px) scale(1);
      }
      100% {
        opacity: 0;
        transform: translate(-50%, -18px) scale(0.92);
      }
    }

    .animate-top-banner {
      animation: topBannerPop 1.1s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    @keyframes eagleFloat {
      0% {
        opacity: 0;
        transform: translate(-50%, 6px) scale(0.7);
      }
      20% {
        opacity: 1;
        transform: translate(-50%, -6px) scale(1.06);
      }
      80% {
        opacity: 1;
        transform: translate(-50%, -18px) scale(1);
      }
      100% {
        opacity: 0;
        transform: translate(-50%, -30px) scale(0.94);
      }
    }

    .animate-eagle {
      animation: eagleFloat 1.15s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    @keyframes dropletShatter {
      0% { transform: scale(1); opacity: 1; }
      35% { transform: scale(1.28) rotate(-10deg); opacity: 0.95; }
      100% { transform: scale(0.75) rotate(8deg); opacity: 0.24; filter: grayscale(0.85); }
    }

    .droplet-lost {
      animation: dropletShatter 0.38s ease-out forwards;
    }

    .game-btn {
      transition: transform 0.12s ease, box-shadow 0.12s ease, filter 0.15s ease;
    }
    .game-btn:active:not(:disabled) {
      transform: scale(0.94);
    }
  </style>
